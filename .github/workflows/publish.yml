name: Publish to PyPI

# Runs when a GitHub Release is published. Uses PyPI trusted publishing, so no
# API token is stored in the repo: add a publisher on pypi.org for project
# domino-web, repository kegsmr/domino, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
