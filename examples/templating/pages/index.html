<!-- The page at /, written like Meteor's index.html: a <head>, a <body>, and components as tags.
     Each component's markup is in components/*.html, its logic in components/*.py -->
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Templates</title>
	<style>
		body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
		.card { border: 1px solid #ddd; border-radius: 8px; padding: 0 1rem 1rem; margin-bottom: 1rem; }
		.hint { color: #666; }
		.todo-form { display: flex; gap: .5rem; }
		.todo-form input { flex: 1; }
		li.done span { text-decoration: line-through; color: #888; }
		.remove { border: 0; background: none; cursor: pointer; font-size: 1.1rem; }
		.faq dt button { all: unset; cursor: pointer; font-weight: 600; }
		.faq dd { margin: .25rem 0 .75rem; }
		button[data-loading] { opacity: .6; }
	</style>
</head>
<body>
	<h1>Templates</h1>
	<p>Markup in HTML, logic in Python. This page is <code>pages/index.html</code>; <a href="/jinja">the same counter in a Jinja page</a>.</p>

	<Card heading="Counter" note="components/counter.py + components/counter.html">
		<Counter />
	</Card>

	<Card heading="Todo list" note="Todos composes in Python: TodoForm and TodoList, or EmptyState">
		<Todos />
	</Card>

	<Card heading="Questions" note="Instant: each answer opens before the server replies">
		<Faq />
	</Card>
</body>
