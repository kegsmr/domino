<!-- The markup of the Counter class in counter.py. Its attributes go on the component's own <div> -->
<Counter class="counter">
	<p>Count: <strong>{{ count }}</strong></p>
	<button on-click="increment">+1</button>
	<button on-click="reset" :disabled="at_zero">Reset</button>
	{{ if at_zero }}
	<p class="hint">Click +1. Every click shows at once, even on a slow connection.</p>
	{{ elif big }}
	<p class="hint">{{ count }} clicks: that's plenty.</p>
	{{ else }}
	<p class="hint">Keep going.</p>
	{{ /if }}
</Counter>
