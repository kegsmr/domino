<layout name="Main">
	<html lang="en">
		<head>
			<meta name="viewport" content="width=device-width, initial-scale=1">
			<title>{{ title }}</title>
			<style>
				body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: grid; place-items: center; min-height: 100vh; margin: 0; }
				h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
				.hint { color: #999; margin: 0 0 1rem; }
				.Canvas { display: grid; width: max-content; user-select: none; touch-action: none; grid-template-columns: repeat(24, 1.25rem); gap: 1px; background: #222; padding: 1px; border-radius: 6px; }
				.Canvas button { width: 1.25rem; height: 1.25rem; border: 0; padding: 0; cursor: crosshair; }
				.Canvas button:hover { outline: 2px solid #fff; outline-offset: -2px; }
				.Palette { display: flex; gap: .4rem; margin: 1rem 0; align-items: center; }
				.Palette button { width: 2rem; height: 2rem; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
				.Palette button.picked { border-color: #fff; transform: scale(1.15); }
				.Palette .clear { border-radius: 6px; width: auto; height: 2rem; padding: 0 .75rem; background: #333; color: #eee; }
				.stats { color: #999; font-size: .9rem; }
			</style>
		</head>
		<body>
			<main><slot /></main>
		</body>
	</html>
</layout>
